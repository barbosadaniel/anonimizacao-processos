version: "3.3"

services:
  postgres:
    image: postgres:16
    container_name: anonimizacao-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: anonimizacao-api
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src

volumes:
  postgres_data: {}
