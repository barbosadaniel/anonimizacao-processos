<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anonimização de Processos</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --ring: rgba(56, 189, 248, 0.28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #020617 0%, #111827 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 1050px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .hero h1 {
      margin: 0;
      font-size: 2rem;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
    }

    .card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .dropzone {
      border: 2px dashed rgba(56, 189, 248, 0.6);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      background: rgba(15, 118, 110, 0.06);
      transition: 0.2s ease;
    }

    .dropzone.dragover {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    input[type="file"] {
      display: none;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--accent);
      color: #06202b;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .file-name {
      color: var(--muted);
      margin-top: 14px;
      min-height: 20px;
    }

    .btn {
      margin-top: 14px;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent), #60a5fa);
      color: #04111d;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .meta-item {
      background: var(--panel-2);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      padding: 12px;
    }

    .meta-item strong {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .summary-box,
    .entities-box,
    .download-box {
      margin-top: 12px;
      background: #0b1220;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      white-space: pre-wrap;
      line-height: 1.55;
    }

    .entity-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .entity-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.14);
      color: #bbf7d0;
      border: 1px solid rgba(34, 197, 94, 0.35);
      font-size: 0.88rem;
    }

    .download-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border-radius: 12px;
      padding: 10px 14px;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .placeholder {
      color: var(--muted);
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .meta { grid-template-columns: 1fr; }
      .hero { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>Anonimização de PDF</h1>
        <p>Upload, resumo, entidades detectadas e download do documento anonimizado.</p>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <form id="uploadForm">
          <div id="dropzone" class="dropzone">
            <label class="file-label" for="file">Selecionar PDF</label>
            <input type="file" id="file" name="file" accept="application/pdf" required />
            <div id="fileName" class="file-name">Nenhum arquivo selecionado.</div>
          </div>
          <button type="submit" class="btn" id="submitBtn">Enviar e processar</button>
          <div id="status" class="status">Pronto para receber um documento.</div>
        </form>
      </div>

      <div class="card">
        <h3>Resumo operacional</h3>
        <div class="meta">
          <div class="meta-item"><strong id="countEntities">0</strong><span>Entidades</span></div>
          <div class="meta-item"><strong id="countTypes">0</strong><span>Tipos</span></div>
          <div class="meta-item"><strong id="countStatus">—</strong><span>Status</span></div>
        </div>
      </div>
    </div>

    <div class="grid" style="margin-top: 18px;">
      <div class="card">
        <h3>Resumo</h3>
        <div id="summary" class="summary-box placeholder">—</div>
      </div>

      <div class="card">
        <h3>Entidades Detectadas</h3>
        <div id="entities" class="entities-box placeholder">—</div>
      </div>
    </div>

    <div class="card" style="margin-top: 18px;">
      <h3>Download do PDF Anonimizado</h3>
      <div id="download" class="download-box placeholder">—</div>
    </div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('file');
    const fileName = document.getElementById('fileName');
    const dropzone = document.getElementById('dropzone');
    const status = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const entitiesEl = document.getElementById('entities');
    const downloadEl = document.getElementById('download');
    const submitBtn = document.getElementById('submitBtn');

    const countEntities = document.getElementById('countEntities');
    const countTypes = document.getElementById('countTypes');
    const countStatus = document.getElementById('countStatus');

    fileInput.addEventListener('change', () => {
      fileName.textContent = fileInput.files.length ? fileInput.files[0].name : 'Nenhum arquivo selecionado.';
    });

    ['dragenter', 'dragover'].forEach((eventName) => {
      dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'));
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'));
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) {
        alert('Selecione um PDF para continuar.');
        return;
      }

      const fd = new FormData();
      fd.append('file', fileInput.files[0]);

      summaryEl.textContent = 'Processando...';
      summaryEl.classList.remove('placeholder');
      entitiesEl.textContent = 'Analizando entidades...';
      entitiesEl.classList.remove('placeholder');
      downloadEl.textContent = 'Aguardando arquivo anonimizado...';
      downloadEl.classList.remove('placeholder');
      status.textContent = 'Enviando o documento para anonimização...';
      submitBtn.disabled = true;
      countEntities.textContent = '0';
      countTypes.textContent = '0';
      countStatus.textContent = '…';

      try {
        const res = await fetch('/process-file', { method: 'POST', body: fd });
        if (!res.ok) throw new Error('Erro no processamento');
        const data = await res.json();
        const entities = Array.isArray(data.entities) ? data.entities : [];
        const types = [...new Set(entities.map((item) => item.type))];

        summaryEl.textContent = data.summary || '—';
        countEntities.textContent = String(entities.length);
        countTypes.textContent = String(types.length);
        countStatus.textContent = 'OK';

        if (!entities.length) {
          entitiesEl.textContent = 'Nenhuma entidade sensível detectada.';
        } else {
          const chips = entities.map((item) => `\n• ${item.type}: ${item.value}`).join('');
          entitiesEl.textContent = chips;
        }

        downloadEl.innerHTML = '';
        const link = document.createElement('a');
        link.className = 'download-link';
        link.href = data.anonymized_download;
        link.textContent = 'Baixar PDF anonimizado';
        link.target = '_blank';
        downloadEl.appendChild(link);
        status.textContent = 'Documento processado com sucesso.';
      } catch (err) {
        summaryEl.textContent = 'Erro: ' + err.message;
        entitiesEl.textContent = '—';
        downloadEl.textContent = '—';
        status.textContent = 'Falha no processamento.';
        countStatus.textContent = 'ERR';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
